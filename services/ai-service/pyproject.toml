[project]
name = "banking-credit-ai-service"
version = "0.1.0"
description = "Synthetic credit-risk inference and policy retrieval service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "numpy>=2.2,<2.5",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "fastembed>=0.7,<1",
  "openai>=1.99,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "httpx>=0.28,<1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/bank_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
