name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project services/ai-service --frozen
      - run: uv run --project services/ai-service ruff check services/ai-service/src services/ai-service/tests
      - run: uv run --project services/ai-service pytest services/ai-service/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: services/web-ui/pnpm-lock.yaml
      - run: pnpm --dir services/web-ui install --frozen-lockfile
      - run: pnpm --dir services/web-ui test --run
      - run: pnpm --dir services/web-ui build

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - run: terraform -chdir=infrastructure/terraform init -backend=false
      - run: terraform -chdir=infrastructure/terraform validate
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0
      - run: kubectl kustomize infrastructure/kubernetes/base > /tmp/base.yaml
      - run: kubectl kustomize infrastructure/kubernetes/overlays/azure > /tmp/azure.yaml
