apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: banking-credit-support
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      serviceAccountName: ai-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-service
          image: ai-service:local
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /internal/v1/health
              port: http
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /internal/v1/health
              port: http
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: model-cache
              mountPath: /.cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: model-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: banking-credit-support
spec:
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8081
      targetPort: http
