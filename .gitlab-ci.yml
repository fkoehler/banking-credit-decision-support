stages:
  - validate
  - test
  - security
  - build
  - image-security
  - deploy

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

java-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - ./mvnw --batch-mode --no-transfer-progress test
  cache:
    key: maven
    paths: [.m2/repository]

python-test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - uv sync --project services/ai-service --frozen
    - uv run --project services/ai-service ruff check services/ai-service/src services/ai-service/tests
    - uv run --project services/ai-service pytest --cov=bank_ai --cov-report=term-missing services/ai-service/tests
  cache:
    key: uv
    paths: [.cache/uv]

web-test:
  stage: test
  image: node:22-alpine
  before_script:
    - corepack enable
  script:
    - pnpm --dir services/web-ui install --frozen-lockfile
    - pnpm --dir services/web-ui test --run
    - pnpm --dir services/web-ui build
  cache:
    key: pnpm
    paths: [.pnpm-store]

terraform-validate:
  stage: validate
  image: hashicorp/terraform:1.5.7
  script:
    - terraform -chdir=infrastructure/terraform fmt -check -recursive
    - terraform -chdir=infrastructure/terraform init -backend=false
    - terraform -chdir=infrastructure/terraform validate

kubernetes-validate:
  stage: validate
  image: bitnami/kubectl:1.32
  script:
    - kubectl kustomize infrastructure/kubernetes/base > /tmp/base.yaml
    - kubectl kustomize infrastructure/kubernetes/overlays/azure > /tmp/azure.yaml

semgrep-sast:
  stage: security
  image: semgrep/semgrep:latest
  script:
    - semgrep scan --config auto --error services

secret-detection:
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.28.0
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-banner --redact --exit-code 1

filesystem-and-iac-scan:
  stage: security
  image:
    name: aquasec/trivy:0.67.2
    entrypoint: [""]
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed .
    - trivy config --exit-code 1 --severity HIGH,CRITICAL infrastructure

.container-build:
  stage: build
  image: docker:29
  services: ["docker:29-dind"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-api:
  extends: .container-build
  script:
    - docker build -f services/banking-api/Dockerfile -t "$CI_REGISTRY_IMAGE/banking-api:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/banking-api:$CI_COMMIT_SHA"

build-ai:
  extends: .container-build
  script:
    - docker build -f services/ai-service/Dockerfile -t "$CI_REGISTRY_IMAGE/ai-service:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/ai-service:$CI_COMMIT_SHA"

build-web:
  extends: .container-build
  script:
    - docker build -f services/web-ui/Dockerfile -t "$CI_REGISTRY_IMAGE/web-ui:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/web-ui:$CI_COMMIT_SHA"

image-scan-and-sbom:
  stage: image-security
  image:
    name: aquasec/trivy:0.67.2
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$CI_REGISTRY_IMAGE/banking-api:$CI_COMMIT_SHA"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$CI_REGISTRY_IMAGE/ai-service:$CI_COMMIT_SHA"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$CI_REGISTRY_IMAGE/web-ui:$CI_COMMIT_SHA"
    - trivy image --format cyclonedx --output sbom-api.cdx.json "$CI_REGISTRY_IMAGE/banking-api:$CI_COMMIT_SHA"
    - trivy image --format cyclonedx --output sbom-ai.cdx.json "$CI_REGISTRY_IMAGE/ai-service:$CI_COMMIT_SHA"
    - trivy image --format cyclonedx --output sbom-web.cdx.json "$CI_REGISTRY_IMAGE/web-ui:$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths: [sbom-api.cdx.json, sbom-ai.cdx.json, sbom-web.cdx.json]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

dast:
  stage: image-security
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  script:
    - zap-baseline.py -t "$DAST_TARGET_URL" -I -r zap-report.html
  artifacts:
    when: always
    paths: [zap-report.html]
  rules:
    - if: $DAST_TARGET_URL

deploy-azure:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:2.76.0
  environment:
    name: development
  id_tokens:
    AZURE_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" --federated-token "$AZURE_OIDC_TOKEN"
    - az aks get-credentials --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_AKS_NAME" --overwrite-existing
    - kubectl apply -k infrastructure/kubernetes/overlays/azure
    - kubectl rollout status deployment/banking-api -n banking-credit-support --timeout=180s
    - kubectl rollout status deployment/ai-service -n banking-credit-support --timeout=180s
    - kubectl rollout status deployment/web-ui -n banking-credit-support --timeout=180s
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
